name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        banco: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: levylly
          POSTGRES_PASSWORD: levylly
          POSTGRES_DB: levylly_leads
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U levylly" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes (${{ matrix.banco }})
        env:
          TEST_DATABASE_URL: ${{ matrix.banco == 'postgres' && 'postgresql+psycopg2://levylly:levylly@localhost:5432/levylly_leads' || '' }}
        run: pytest -q
