services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: levylly
      POSTGRES_PASSWORD: levylly
      POSTGRES_DB: levylly_leads
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levylly -d levylly_leads"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://levylly:levylly@db:5432/levylly_leads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados:
